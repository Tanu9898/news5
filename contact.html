<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css?v=6">
</head>
<body style="background-color: #fafafa;">
    <!-- Simple Header -->
    <header class="simple-header">
        <div class="header-container">
            <span class="logo">Uttarakhand Live</span>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <nav class="simple-nav" id="nav-menu">
                <a href="index.html">HOME</a>
                <a href="blog.html">BLOG</a>
                <a href="contact.html" class="active">CONTACT</a>
            </nav>
        </div>
    </header>

    <!-- Contact Content -->
    <main class="container">
        <div class="contact-hero">
            <h1>Get in Touch</h1>
            <p>Have a tip, a question, or want to advertise with us? We'd love to hear from you.</p>
        </div>

        <div class="contact-cards">
            <div class="contact-card">
                <div class="icon-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
                <h3>Email Us</h3>
                <p>hello@uttarakhandlive.com<br>support@uttarakhandlive.com</p>
            </div>
            
            <div class="contact-card">
                <div class="icon-circle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </div>
                <h3>Visit Us</h3>
                <p>123 Innovation Drive<br>Tech District, 10001</p>
            </div>
        </div>
    </main>

    <!-- Simple Footer -->
    <footer class="simple-footer">
        <div class="container">
            <p>&copy; 2026 Uttarakhand Live. All rights reserved.</p>
        </div>
    </footer>
